        :root {

        body {
            margin: 0;

            text-decoration: none;
            color: var(--text-color);
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .nav-item:hover {
            border-bottom-color: var(--text-color);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Sunlight effect */
        .sunlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* Notice Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(253, 251, 247, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal:not([hidden]) {
            opacity: 1;
            pointer-events: auto;
        }

        .notice-content {
            background-color: #fff;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(142, 142, 142, 0.15);
            text-align: center;
            position: relative;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(142, 142, 142, 0.1);
            animation: slideUp 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .notice-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .notice-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
        }

        .notice-text {
            font-family: 'Gowun Batang', serif;
            font-size: 1.1rem;
            color: var(--text-color);
            line-height: 1.6;
            word-break: keep-all;
            margin: 0;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #333;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .top-link {
            position: absolute;
            top: 2rem;

            transform: translateX(-50%);
            text-decoration: none;
            font-size: 1.5rem;
            opacity: 0.7;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 10;
        }

        .top-link:hover {
            opacity: 1;
            transform: translateX(-50%) scale(1.1);
